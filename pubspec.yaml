name: carelite_app
description: "CareLite (Care Lite Health) - GIS-integrated telemedicine platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Backend — Django REST API (JWT via simplejwt).
  # dio over bare http for interceptor-based refresh-on-401.
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Routing
  go_router: ^14.2.0

  # Dependency injection (manual registration, no codegen)
  get_it: ^7.7.0

  # Device capabilities
  local_auth: ^2.3.0
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  image_picker: ^1.1.2
  file_picker: ^10.3.3
  permission_handler: ^11.3.1
  

  # Local key-value storage (onboarding / permission-prompt flags)
  shared_preferences: ^2.3.2

  # Formatting / small utilities
  intl: ^0.19.0
  logging: ^1.2.0
  toastification: ^3.2.0
  flutter_local_notifications: ^22.3.0

  cupertino_icons: ^1.0.8
  geocoding: ^5.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600


# App icon. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
